# OrbitaTI: integração contínua (bloco 8). Dois jobs em paralelo:
#   api  sobe a stack do Docker Compose e roda a suíte inteira (unitários + integração + lentos)
#   web  Portal: unitários, build e E2E do Playwright contra o simulador do contrato
#
# Nenhum segredo real: o .env vem do .env.example (valores falsos que funcionam). Por isso o workflow
# também roda em PR de fork, que não recebe os secrets do repositório.
#
# O workflow só pinta o check de vermelho. Quem BLOQUEIA o merge é a regra do repositório no GitHub
# (Settings → Branches → regra do main → "Require status checks to pass" com api e web). Ver o README.
name: CI

on:
  # push: qualquer branch deste repositório (inclusive o branch descartável do T-ISO-14, sem PR).
  push:
  # pull_request: o Cristofer manda PR do fork (Crisini/OrbitaTI). Push em fork não dispara workflow
  # aqui, só o pull_request. Efeito colateral aceito: PR de branch deste repositório roda duas vezes.
  pull_request:

# O workflow só lê o código; o token do GitHub não precisa de escrita.
permissions:
  contents: read

# Push novo no mesmo branch cancela a execução anterior (ninguém quer o resultado do commit velho).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Valores de exemplo: o banco do CI nasce vazio a cada execução e morre com o runner.
      - name: Criar .env a partir do .env.example
        run: cp .env.example .env

      # Antes do compose: lockfile quebrado falha em segundos, não depois de 3 min de build de imagens.
      - name: Instalar dependências (raiz e services/*)
        run: npm ci

      # Diagnóstico: o "up --wait" com o migrate saindo em 0 depende da versão do Compose.
      - name: Versões do Docker
        run: docker version --format '{{.Server.Version}}' && docker compose version

      - name: Subir a stack (postgres, redis, migrate, api-contatos, importacao)
        run: docker compose up -d --build --wait

      # TESTES_LENTOS=1: o plano de testes manda o T-IMP-13 (pausa de 500 ms, ~25 s) rodar no CI.
      - name: Testes (npm test)
        run: npm test
        env:
          TESTES_LENTOS: '1'

      # Seed no banco do CI, que nasce vazio: cobre o caminho "conta nova" (cadastro, contatos com estágio,
      # interações retroativas). Depois do npm test: os testes apagam só os tenants que eles criaram.
      - name: Seed (1ª execução, banco sem as contas de demonstração)
        run: npm run seed

      # Idempotência: a 2ª execução não pode criar nem alterar nada. --sem-mudancas faz o seed sair com
      # código 1 se criar ou alterar qualquer coisa, e o job falha.
      - name: Seed (2ª execução, não pode criar nada)
        run: npm run seed -- --sem-mudancas

      - name: Logs da stack (só se algo falhou)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # web/ é pacote independente, fora dos workspaces da raiz.
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do Portal
        run: npm ci

      - name: Testes unitários (Portal e simulador)
        run: npm test

      - name: Build (Vite)
        run: npm run build

      # E2E no mesmo caminho do usuário: navegador → nginx da imagem → /api → simulador.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Subir o simulador do contrato (3001)
        run: |
          nohup npm run simulador > simulador.log 2>&1 &
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3001/saude

      # --network host: o simulador escuta só em 127.0.0.1. No Linux o host.docker.internal (usado no
      # Windows) não alcança esse endereço; com a rede do host, o nginx vê o simulador como "localhost".
      - name: Imagem do Portal (nginx) apontando para o simulador
        run: |
          docker build -t orbitati/web:0.1.0 .
          docker run -d --name portal --network host -e API_UPSTREAM=127.0.0.1:3001 orbitati/web:0.1.0
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/healthz

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          E2E_URL: http://localhost:8080

      - name: Logs do simulador e do nginx (só se algo falhou)
        if: failure()
        run: |
          cat simulador.log || true
          docker logs portal || true

      - name: Relatório do Playwright (só se algo falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
