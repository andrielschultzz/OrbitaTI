<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: versão simplificada do símbolo, sem blur e com traços grossos, legível em 16 px.
       Fundo arredondado escuro para aparecer em abas claras e escuras. -->
  <defs>
    <linearGradient id="f-anel" gradientUnits="userSpaceOnUse" x1="4" y1="32" x2="60" y2="32">
      <stop offset="0" stop-color="#4769E5"/>
      <stop offset="0.55" stop-color="#42DEF7"/>
      <stop offset="1" stop-color="#24E0D1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#020A1F"/>
  <g transform="rotate(-22 32 32)" fill="none" stroke="url(#f-anel)" stroke-width="5" stroke-linecap="round">
    <path d="M 5 32 A 27 8 0 0 1 59 32"/>
  </g>
  <circle cx="32" cy="32" r="15" fill="#0B1B30" stroke="#42DEF7" stroke-width="4"/>
  <g transform="rotate(-22 32 32)" fill="none" stroke="url(#f-anel)" stroke-width="5" stroke-linecap="round">
    <path d="M 59 32 A 27 8 0 0 1 5 32"/>
  </g>
</svg>
