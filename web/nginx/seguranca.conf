# Cabeçalhos de segurança do Portal. Ficam num arquivo à parte porque, no nginx, um add_header
# dentro de um location ANULA os add_header herdados do server. Cada location que define o próprio
# Cache-Control inclui este arquivo de novo, para nunca perder a CSP.
# "always": vale também nas respostas de erro (404, 413...).
#
# CSP: tudo da própria origem. Nada de CDN, nada de script ou estilo inline em HTML (o tema inicial
# é um arquivo externo, /tema-inicial.js). img-src aceita data: (SVGs pequenos que o Vite embute).
# Sem HSTS: o Portal pode rodar em HTTP (VM do laboratório). HSTS entra quando houver HTTPS.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
