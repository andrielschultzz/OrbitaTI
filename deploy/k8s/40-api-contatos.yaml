# API de Contatos: 2 réplicas atrás de um Service ClusterIP (só dentro do cluster).
# Desde a Fase 6 do bloco 13, quem fica na NodePort 30080 é o nginx do Portal (70-web.yaml), que faz proxy
# de /api para cá. Antes disso a API era o NodePort 30080.
#
# Probes (diferença importante em relação ao compose):
#   readiness  GET /saude  -> 503 com o banco fora: o pod sai do Service, mas NÃO é reiniciado.
#   liveness   TCP :3000   -> só "o processo está vivo e escutando". Não depende do banco: se dependesse,
#                             um banco fora faria o Kubernetes reiniciar TODAS as réplicas em loop, sem
#                             consertar nada (o problema está no banco, não na API).
apiVersion: v1
kind: Service
metadata:
  name: api-contatos
  namespace: orbitati
spec:
  type: ClusterIP
  selector:
    app: api-contatos
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-contatos
  namespace: orbitati
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-contatos
  template:
    metadata:
      labels:
        app: api-contatos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # usuário "node" da imagem
      containers:
        - name: api-contatos
          image: orbitati/api-contatos:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Pausa de 5 s ANTES do SIGTERM. Sem ela, num rollout o app.close() recusa conexões enquanto o
          # kube-proxy ainda manda tráfego para este pod (os endpoints levam alguns segundos para
          # atualizar) e o cliente recebe "connection refused". Visto na prática: o seed logo depois de
          # um `rollout restart` falhou com "API fora do ar". O sleep é o do busybox da imagem alpine.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            # Só as chaves de que a API precisa (menor privilégio), como no compose.
            - name: DATABASE_URL_API
              valueFrom: { secretKeyRef: { name: orbitati-segredos, key: DATABASE_URL_API } }
            - name: JWT_SEGREDO
              valueFrom: { secretKeyRef: { name: orbitati-segredos, key: JWT_SEGREDO } }
            - name: JWT_SERVICO_SEGREDO
              valueFrom: { secretKeyRef: { name: orbitati-segredos, key: JWT_SERVICO_SEGREDO } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: orbitati-segredos, key: REDIS_URL } }
            # 1 (J6 em docs/pendencias-bloco-7.md): a API é ClusterIP e quem conecta nela é o nginx do Portal,
            # que ACRESCENTA o IP que viu no X-Forwarded-For. Com 1 salto, um X-Forwarded-For forjado pelo
            # cliente fica à esquerda e é ignorado. Era 0 enquanto a API estava exposta direto no NodePort
            # (com 1, qualquer cliente de localhost:30080 forjaria o IP).
            - name: TRUST_PROXY_SALTOS
              value: "1"
            - name: LIMITE_CADASTRO_POR_MIN
              value: "60"
            # Base do link do e-mail de confirmação (bloco 10). Valor no manifesto, e não no Secret: não é
            # segredo, e o Secret só é criado se ainda não existe (um cluster antigo nunca o receberia).
            # A 30080 é o Portal (70-web.yaml): o link abre /confirmar-email, que chama /api/auth/confirmar
            # (N1 em docs/pendencias-bloco-7.md, fechada na Fase 6 do bloco 13).
            - name: PORTAL_URL
              value: "http://localhost:30080"
          readinessProbe:
            httpGet:
              path: /saude
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Pequenos, como no Lab 04. O argon2 do login usa ~19 MiB por hash; o limite deixa folga.
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
