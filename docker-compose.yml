# OrbitaTI: stack local. postgres, redis, migrate (job), api-contatos, importacao (worker),
# notificacoes (worker de e-mail) e mailpit (caixa de e-mail falsa, bloco 10).
# O Portal (bloco 13, Fase 6) entra aqui depois.
#
#   docker compose up -d --build --wait   sobe tudo; o migrate roda e SAI antes de a API subir
#   docker compose run --rm migrate       aplica só as migrações pendentes
#
# Variáveis vêm do .env (copie o .env.example ou rode `npm run env`).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbitati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Lidas só pelo db/init/01-papeis.sh, no primeiro boot (volume vazio).
      DB_SENHA_MIGRADOR: ${DB_SENHA_MIGRADOR:?defina DB_SENHA_MIGRADOR no .env}
      DB_SENHA_API: ${DB_SENHA_API:?defina DB_SENHA_API no .env}
      DB_SENHA_IMPORTACAO: ${DB_SENHA_IMPORTACAO:?defina DB_SENHA_IMPORTACAO no .env}
    volumes:
      - pgdados:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Só 127.0.0.1: os testes rodam no host e precisam do banco, mas ninguém da rede alcança a porta.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h 127.0.0.1: testa pelo TCP. Durante o init o Postgres só aceita socket local; assim o
      # "saudável" só aparece depois que os papéis foram criados e o servidor reiniciou para valer.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orbitati"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Sem porta publicada: só os serviços da rede do compose falam com o Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # Imagem própria e pequena (db/Dockerfile): o pg vai dentro dela, sem depender do node_modules do
    # host. É a mesma imagem orbitati/migrate que o kind (bloco 6) reaproveita.
    build: ./db
    image: orbitati/migrate:0.1.0
    # Job: roda, aplica o que falta e SAI. Sem perfil desde o bloco 2: a api-contatos depende dele com
    # service_completed_successfully, e com isso o `up --wait` entende que "Exited (0)" é sucesso, não
    # falha (testado no Compose v5.3.1). Se a migração falhar (exit 1), o `up` falha e a API nem inicia.
    # Cada `up` roda o migrate de novo; é seguro porque o migrate.js é idempotente.
    environment:
      DATABASE_URL: ${DATABASE_URL_MIGRADOR:?defina DATABASE_URL_MIGRADOR no .env}
    volumes:
      # Só no ambiente local: a migração nova vale sem rebuild. A imagem também traz as migrações,
      # para o kind e o CI, que não montam pastas do host.
      - ./db/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-contatos:
    # Contexto na raiz: o lockfile dos workspaces fica lá (ver o Dockerfile e o .dockerignore).
    build:
      context: .
      dockerfile: services/api-contatos/Dockerfile
    image: orbitati/api-contatos:0.1.0
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:?defina DATABASE_URL_API no .env}
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env}
      # Segredo separado: só o token de serviço do worker (rotas /interno, regra 7).
      JWT_SERVICO_SEGREDO: ${JWT_SERVICO_SEGREDO:?defina JWT_SERVICO_SEGREDO no .env}
      # A API só ENFILEIRA importações. Redis fora: POST /importacoes -> 503 e /saude -> 200 {fila:"fora"}.
      REDIS_URL: ${REDIS_URL:?defina REDIS_URL no .env}
      # Rate limit (bloco 5). 1 salto = o Nginx do Portal na frente; só vale para quem conecta pela rede
      # interna. Seguro aqui porque a porta 3000 só existe em 127.0.0.1 (ver "ports" abaixo).
      TRUST_PROXY_SALTOS: ${TRUST_PROXY_SALTOS:-1}
      LIMITE_CADASTRO_POR_MIN: ${LIMITE_CADASTRO_POR_MIN:-60}
      # Base do link do e-mail de confirmação (bloco 10). Sem padrão de propósito: esquecer na VM
      # mandaria links para "localhost" a clientes reais. Com :?, o compose avisa na hora.
      PORTAL_URL: ${PORTAL_URL:?defina PORTAL_URL no .env, veja o .env.example}
    # Só 127.0.0.1: os testes e o curl rodam no host. Na VM, só o Portal fica exposto; a API é
    # alcançada pelo proxy /api do nginx, dentro da rede do compose.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      # Só sobe depois que as migrações terminaram com sucesso: nunca roda contra um schema velho.
      migrate:
        condition: service_completed_successfully
      # Só ordena a PARTIDA (sobe com a fila pronta). Se o Redis cair depois, a API continua no ar.
      redis:
        condition: service_healthy
    healthcheck:
      # wget vem no Alpine (busybox). /saude responde 503 só com o banco fora (com a fila fora é 200).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/saude"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    # Endurecimento: sistema de arquivos só leitura (a API não grava nada), com /tmp em memória para
    # biblioteca que precise de arquivo temporário; nenhuma capability do Linux; sem escalar privilégio.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  importacao:
    # Worker BullMQ (bloco 4). Lê o CSV do job, grava erros de linha no schema importacao e envia os
    # contatos à API pelas rotas /interno, com token de serviço. Nunca toca o schema orbita (regra 7).
    build:
      context: .
      dockerfile: services/importacao/Dockerfile
    image: orbitati/importacao:0.1.0
    environment:
      DATABASE_URL_IMPORTACAO: ${DATABASE_URL_IMPORTACAO:?defina DATABASE_URL_IMPORTACAO no .env}
      REDIS_URL: ${REDIS_URL:?defina REDIS_URL no .env}
      JWT_SERVICO_SEGREDO: ${JWT_SERVICO_SEGREDO:?defina JWT_SERVICO_SEGREDO no .env}
      API_URL_INTERNA: ${API_URL_INTERNA:?defina API_URL_INTERNA no .env}
      # Lote e pausa do ADR-003. O teste de carga (bloco 9) troca para comparar com e sem a mitigação.
      IMPORT_LOTE: ${IMPORT_LOTE:-100}
      IMPORT_PAUSA_MS: ${IMPORT_PAUSA_MS:-500}
    # Sem "ports": nenhuma porta publicada. O /saude (3001) só é usado pelo healthcheck, de dentro.
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # O worker grava pela API: sem ela no ar, todo lote falharia.
      api-contatos:
        condition: service_healthy
    healthcheck:
      # 200 só com banco e fila ok (sem um dos dois o worker não trabalha).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/saude"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    # Tempo para terminar o job em andamento no SIGTERM. Se passar, o job volta à fila e recomeça
    # sem duplicar nada (idempotência, T-IMP-14).
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  mailpit:
    # Caixa de e-mail falsa (bloco 10): recebe por SMTP tudo o que o serviço de notificações envia e mostra
    # numa interface web. Nenhum e-mail sai para a internet. O teste do CQ-03 consulta a API dela.
    # Versão fixa: a v1.33.1 saiu na véspera do bloco 10; a v1.32.0 já tinha duas semanas de uso.
    image: axllent/mailpit:v1.32.0
    # A imagem roda como root por padrão. Não precisa: as portas são > 1024 e ele só grava no /tmp.
    user: "65534:65534"
    environment:
      # Guarda só as últimas 1.000 mensagens (em memória/tmp): a suíte manda dezenas por execução.
      MP_MAX_MESSAGES: 1000
    # SMTP (1025) SEM porta publicada: só a rede do compose envia. Interface e API (8025) só em 127.0.0.1:
    # o teste roda no host, e mais ninguém da rede lê os e-mails (eles carregam links que valem 24 h).
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  notificacoes:
    # Worker BullMQ da fila "emails" (bloco 10). Sem banco: tudo vem no job. Envia pelo SMTP do Mailpit.
    build:
      context: .
      dockerfile: services/notificacoes/Dockerfile
    image: orbitati/notificacoes:0.1.0
    environment:
      REDIS_URL: ${REDIS_URL:?defina REDIS_URL no .env}
      SMTP_HOST: mailpit
      SMTP_PORTA: 1025
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-OrbitaTI <nao-responda@orbitati.local>}
    # Sem "ports": o /saude (3001) só é usado pelo healthcheck, de dentro.
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/saude"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  k6:
    # Teste de carga do CQ-01 (bloco 9). Só existe com o profile: `up` normal não o sobe.
    #   docker compose --profile carga run --rm k6 run /scripts/cq01.js
    # Roda DENTRO da rede do compose: mede a API do lado do servidor, sem rede doméstica nem 4G no meio.
    # Versão fixa: outra versão do k6 pode mudar o cálculo do resumo e tornar as rodadas incomparáveis.
    image: grafana/k6:1.3.0
    profiles: [carga]
    environment:
      API_URL: http://api-contatos:3000
    volumes:
      - ./tests/carga:/scripts:ro
      # Saída (JSON das requisições e resumo). O medir-cq01.ps1 cria uma pasta por execução aqui dentro.
      - ./tests/carga/resultados:/resultados
    depends_on:
      api-contatos:
        condition: service_healthy

volumes:
  pgdados:
